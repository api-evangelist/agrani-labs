aid: agrani-labs
name: Agrani Labs
description: 'Agrani Labs is a Bengaluru, India semiconductor and systems-software company founded in
  December 2024 by Dheemanth Nagaraj (CEO), Ashok Jagannathan (chief architect), Srikanth Nimmagadda (CTO)
  and Rajesh Vivekanandham (chief performance architect), all former AMD and Intel engineers, with Pentium
  architect Vinod Dham as founding advisor. The company is building indigenous AI GPUs together with the
  full software stack around them — compilers, kernel and math libraries, system software and AI frameworks
  — for enterprise and datacenter compute in North America and Asia, and emerged from stealth in January
  2026 with an $8M seed round led by Peak XV Partners. Agrani Labs is a pre-product silicon company: agranilabs.com
  is a single static marketing page with a team section, a Notion-hosted careers site and a contact form,
  and it publishes no developer portal, documentation, API reference, SDK, CLI, changelog, status page
  or pricing. Enrichment probing on 2026-09-12 found no OpenAPI, Swagger, GraphQL, AsyncAPI, WSDL, gRPC,
  MCP or A2A agent-card surface on any host, no /.well-known/ documents, no public GitHub organization
  and no first-party packages in npm, PyPI, Maven Central, NuGet, RubyGems, crates.io or pkg.go.dev.'
